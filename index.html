* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; display: grid; place-items: center; padding: 16px; }
.rule { position: fixed; top: 0; left: 0; right: 0; height: 6px; display: grid; grid-template-columns: repeat(4, 1fr); }

p { margin: 0; color: var(--silver); font-size: 15px; line-height: 1.5; }
label { font: 600 12px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--silver); }
input { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid #33373B; background: #1B1D20; color: #FFFFFF; width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid #7DB6D2; outline-offset: 2px; }
button { font: 600 13px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; padding: 13px; background: var(--maroon); color: #FFFFFF; border: 0; cursor: pointer; }
.err { color: #F0867E; min-height: 20px; font-size: 14px; }
</style>

  async function open(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: IT, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
